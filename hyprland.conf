# hyprland.conf — Japon WS2

monitor=,preferred,auto,1
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(c4682abf)
    col.inactive_border = rgba(c4682a55)
}

decoration {
    rounding = 0
    blur = yes
    blur_size = 3
    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(00000044)
}

exec-once = swaybg -i ~/.config/omarchy/themes/japon_ws2/backgrounds/japon-ws2-wallpaper.png -m fill

bind = SUPER, space, exec, quickshell -p ~/.config/quickshell/japon_ws2/shell.qml